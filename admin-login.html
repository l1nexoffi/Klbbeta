<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>KLB STORE — Вход администратора</title><link rel="stylesheet" href="admin.css"><style>
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 10%,#10213b,transparent 55%),#080b12}.login-card{width:min(100%,430px);padding:34px;border:1px solid #263348;border-radius:20px;background:#101722;box-shadow:0 30px 90px #0007}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:30px;font-weight:800;font-size:20px}.login-brand .logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#267cff;color:white}.login-card h1{font-size:26px;margin:0 0 8px}.login-card p{color:#9ba9bc;margin:0 0 24px}.login-card label{display:block;font-size:13px;color:#b8c4d4;margin:16px 0 7px}.login-card input{box-sizing:border-box;width:100%;padding:13px 14px;border:1px solid #2c394c;border-radius:10px;background:#0b111a;color:white;font:inherit}.login-card button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#287dff;color:#fff;font:inherit;font-weight:700;cursor:pointer}.login-error{display:none;color:#ff7f8e;font-size:13px;margin-top:12px}.login-note{font-size:12px!important;margin-top:20px!important;color:#78879c!important}.back{display:inline-block;margin-top:20px;color:#9ba9bc;text-decoration:none}
